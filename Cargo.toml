[package]
name = "moleman"
version = "0.1.0"
edition = "2021"
description = "A terminal UI for managing AWS SSM/SSH tunnels and SSO sessions"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "net", "sync", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
configparser = "3"
chrono = { version = "0.4", features = ["clock"] }
anyhow = "1"
sha1 = "0.10"
libc = "0.2"

[profile.release]
strip = true
lto = true
